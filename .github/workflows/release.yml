name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to package and publish (e.g. v0.2.2)'
        required: true
        default: 'v0.2.2'
        type: string
      draft:
        description: 'Create GitHub Release as a draft'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark GitHub Release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Verify, Package & Publish Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Determine target tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository metadata (CHANGELOG)
        uses: actions/checkout@v4
        with:
          path: meta

      - name: Checkout target tag (${{ steps.meta.outputs.tag }})
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0
          path: src

      - name: Checkout hugi v0.1.4 (runner only)
        uses: actions/checkout@v4
        with:
          repository: boxxxie/hugi
          ref: v0.1.4
          path: hugi
          persist-credentials: false

      - name: Init hugi obench submodule
        run: git -C hugi submodule update --init deps/obench

      - name: Setup Odin compiler
        uses: laytan/setup-odin@v2
        with:
          release: latest
          token: ${{ secrets.GITHUB_TOKEN }}
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyArrow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "pyarrow>=25.0.0" || python3 -m pip install pyarrow

      - name: Verify target tag builds, passes tests, and builds docs
        working-directory: src
        run: |
          make check
          make test
          make test-cpp
          odin doc skadi > /dev/null
          if [ -d skadi/pipeline ]; then odin doc skadi/pipeline > /dev/null; fi
          if [ -d deps/sleipnir/actor ]; then odin doc deps/sleipnir/actor > /dev/null; fi

      - name: Package source archives and native CLI tools
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${{ steps.meta.outputs.version }}"
          mkdir -p dist

          git -C src archive --format=tar.gz --prefix="skadi-${VER}/" HEAD > "dist/skadi-${TAG}-src.tar.gz"
          git -C src archive --format=zip --prefix="skadi-${VER}/" HEAD > "dist/skadi-${TAG}-src.zip"

          make -C src parquet-odin csv-to-parquet-odin
          mkdir -p "dist/skadi-tools-${TAG}-linux-x86_64"
          cp src/bin/csv_to_parquet_odin src/bin/parquet_to_csv_odin src/LICENSE src/README.md "dist/skadi-tools-${TAG}-linux-x86_64/"
          tar -C dist -czf "dist/skadi-tools-${TAG}-linux-x86_64.tar.gz" "skadi-tools-${TAG}-linux-x86_64"
          rm -rf "dist/skadi-tools-${TAG}-linux-x86_64"

          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)
          ls -lh dist

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VER="${{ steps.meta.outputs.version }}"
          python3 - "$VER" meta/CHANGELOG.md dist/RELEASE_NOTES.md <<'PY'
          import re, sys

          version, changelog_path, out_path = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(changelog_path, "r", encoding="utf-8").read()
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          m = pattern.search(text)
          if m:
              body = m.group(1).strip()
              open(out_path, "w", encoding="utf-8").write(body + "\n")
              print("found=true")
          else:
              print("found=false")
          PY
          if [ -s dist/RELEASE_NOTES.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          FLAGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.draft }}" = "true" ]; then FLAGS+=(--draft); fi
            if [ "${{ inputs.prerelease }}" = "true" ]; then FLAGS+=(--prerelease); fi
          elif [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi

          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            NOTES_FLAGS=(--notes-file dist/RELEASE_NOTES.md)
          else
            NOTES_FLAGS=(--generate-notes)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt \
              --title "Skadi ${TAG}" \
              "${NOTES_FLAGS[@]}" \
              "${FLAGS[@]}"
          fi
